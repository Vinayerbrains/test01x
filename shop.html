<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionX Smart Glasses - Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white">

    <!-- Header -->
    <header class="bg-gray-800 p-6">
        <nav class="flex justify-between items-center max-w-7xl mx-auto">
            <div class="text-2xl font-bold">VisionX</div>
            <ul class="flex space-x-8">
                <li><a href="index.html" class="hover:text-primary">Home</a></li>
                <li><a href="shop.html" class="text-primary">Shop</a></li>
                <li><a href="cart.html" class="hover:text-primary">Cart</a></li>
            </ul>
        </nav>
    </header>

    <!-- Shop Header -->
    <section class="py-12 bg-gray-900 text-center">
        <h1 class="text-5xl font-bold mb-4">Shop VisionX</h1>
        <p class="text-gray-400">Choose your perfect smart glasses</p>
    </section>

    <!-- Filters & Sort -->
    <div class="bg-gray-800 p-6 flex flex-wrap gap-4 justify-between items-center">
        <div class="flex gap-4 flex-wrap">
            <select id="category-filter" class="bg-gray-700 text-white px-4 py-2 rounded">
                <option value="all">All Categories</option>
                <option value="smart">Smart Glasses</option>
                <option value="ar">AR Glasses</option>
                <option value="accessories">Accessories</option>
            </select>
            <select id="price-filter" class="bg-gray-700 text-white px-4 py-2 rounded">
                <option value="all">All Prices</option>
                <option value="0-200">$0 - $200</option>
                <option value="200-500">$200 - $500</option>
                <option value="500-999">$500 - $999</option>
            </select>
        </div>
        <select id="sort-filter" class="bg-gray-700 text-white px-4 py-2 rounded">
            <option value="featured">Sort: Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Top Rated</option>
        </select>
    </div>

    <!-- Product Grid -->
    <section class="py-12 max-w-7xl mx-auto px-6">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
